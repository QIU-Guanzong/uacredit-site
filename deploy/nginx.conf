# Production configuration for uacredit.hk and www.uacredit.hk.
# The content desk remains accessible through IAP/SSH; public /admin is denied.
# Requires "trusted_proxy_hops": 1 in /etc/uacredit/config.json so rate limits use the visitor address.
# X-Forwarded-For is overwritten (not appended) so a client cannot inject an address.
server {
    listen 80;
    listen [::]:80;
    server_name uacredit.hk www.uacredit.hk;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://uacredit.hk$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.uacredit.hk;
    ssl_certificate /etc/letsencrypt/live/uacredit.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uacredit.hk/privkey.pem;
    return 301 https://uacredit.hk$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uacredit.hk;
    ssl_certificate /etc/letsencrypt/live/uacredit.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uacredit.hk/privkey.pem;
    # Start short; raise only after the domain has served HTTPS correctly for a while.
    add_header Strict-Transport-Security "max-age=300" always;
    client_max_body_size 2m;
    location /admin { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8744;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
