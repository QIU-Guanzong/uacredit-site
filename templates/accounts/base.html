<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ title|default('客戶中心') }}｜環聯亞洲信貸</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/account.css">
  <script src="/assets/account.js" defer></script>
</head>
<body class="account">
  <a class="account-skip" href="#account-main">跳至主要內容</a>
  <div class="preview">客戶中心預覽 · 正式貸款申請尚未開放</div>
  <header>
    <div class="wrap header-inner">
      <a href="/" class="brand" aria-label="環聯亞洲信貸首頁"><img src="/assets/logo.png" width="220" height="36" alt="環聯（亞洲）信貸有限公司"></a>
      <div class="account-header-actions">
        <a class="account-back" href="/">以訪客瀏覽 <span aria-hidden="true">↗</span></a>
        {% if session.customer_id %}
        <form class="account-logout" method="post" action="/account/logout/">
          <input name="csrf" type="hidden" value="{{ csrf() }}">
          <button type="submit">登出</button>
        </form>
        {% endif %}
      </div>
    </div>
  </header>
  <main id="account-main" class="wrap account-main">
    {% for message in get_flashed_messages() %}<p class="account-flash" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="account-footer">
    <div class="wrap">
      <span>環聯（亞洲）信貸有限公司</span>
      <nav aria-label="客戶中心資訊"><a href="/account/privacy/">帳戶私隱說明</a><a href="/account/delete-info/">刪除帳戶說明</a><a href="/contact/">聯絡我們 <span aria-hidden="true">↗</span></a></nav>
    </div>
  </footer>
</body>
</html>
