{% extends 'accounts/base.html' %}{% block content %}<section class="narrow-form"><a href="/account/" class="text-link">← 返回客戶中心</a><div class="eyebrow">帳戶保安</div><h1>更改密碼</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>目前密碼<input type="password" name="current" autocomplete="current-password" maxlength="128" required></label><label>新密碼<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>再次輸入新密碼<input type="password" name="confirm" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="field-hint">密碼更新後，所有裝置須重新登入。</p><button class="button">更新密碼 →</button></form></section>{% endblock %}
